name: 🚢 Shipyard Main Builder
on:
  push:
    branches: [main]
    paths: ["images/**"]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6

      - name: Get changed directories
        id: changed-dirs
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: images/**
          dir_names: true
          dir_names_max_depth: 3
          matrix: true

      - name: Set matrix
        id: set-matrix
        shell: bash
        env:
          CHANGED_DIRS: ${{ steps.changed-dirs.outputs.all_changed_files }}
        run: |
          set -euo pipefail
          result="[]"
          echo "changed dirs: $CHANGED_DIRS"

          while IFS= read -r dir; do
            name=$(echo "$dir" | cut -d'/' -f2)
            path="./$dir"
            # "^\s*#" matches lines where "#" is the first non-whitespace character, so it handles both "#" comment and "  # indented comment".
            version=$(grep -v '^\s*#' "$dir/VERSION" || exit 1)
            labels=$(grep -v '^\s*#' "$dir/LABELS" || exit 1)
            result=$(echo "$result" | jq \
              --arg name "$name" \
              --arg path "$path" \
              --arg version "$version" \
              --arg labels "$labels" \
              '. += [{"name": $name, "path": $path, "version": $version, "labels": $labels}]')
          done < <(echo "$CHANGED_DIRS" | jq -r '.[]')

          echo "matrix<<EOF" >> "$GITHUB_OUTPUT"
          echo "$result" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

  build-images:
    needs: detect-changes
    if: needs.detect-changes.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    uses: ./.github/workflows/_base.yaml
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    with:
      image_name: ${{ matrix.image.name }}
      context_path: ${{ matrix.image.path }}
      version: ${{ matrix.image.version }}
      extra_labels: ${{ matrix.image.labels }}
