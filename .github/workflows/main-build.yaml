name: 🚢 Shipyard Main Builder
on:
  push:
    branches: [main]
    paths: ["images/**"]
  pull_request:
    paths: ["images/**"]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      - name: Get changed directories
        id: changed-dirs
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: images/**
          dir_names: true
          dir_names_max_depth: 3
          matrix: true

      - name: Set matrix
        id: set-matrix
        shell: bash
        env:
          CHANGED_DIRS: ${{ steps.changed-dirs.outputs.all_changed_files }}
        run: |
          set -euo pipefail
          result="[]"
          echo "changed dirs: $CHANGED_DIRS"

          while IFS= read -r dir; do
            # App name is the first subdirectory in images/
            # e.g. images/filen-cli -> filen-cli
            app_name=$(echo "$dir" | cut -d'/' -f2)
            path="./$dir"

            # "^\s*#" matches lines where "#" is the first non-whitespace character, so it handles both "#" comment and "  # indented comment".
            version=$(grep -v '^\s*#' "$dir/VERSION" || exit 1)
            labels=$(grep -v '^\s*#' "$dir/LABELS" || exit 1)

            # Find all Dockerfiles in this directory
            # Matches "Dockerfile" or "*.Dockerfile"
            for df in $(find "$dir" -maxdepth 1 \( -name "Dockerfile" -o -name "*.Dockerfile" \)); do
              df_filename=$(basename "$df")
              
              # Extract flavour name
              # e.g. "debian.Dockerfile" -> "debian"
              # e.g. "Dockerfile" -> "" (empty string)
              if [[ "$df_filename" == "Dockerfile" ]]; then
                flavour=""
              else
                flavour="${df_filename%.Dockerfile}"
              fi

              result=$(echo "$result" | jq \
                --arg name "$app_name" \
                --arg path "$path" \
                --arg dockerfile "$df_filename" \
                --arg flavour "$flavour" \
                --arg version "$version" \
                --arg labels "$labels" \
                '. += [{"name": $name, "path": $path, "dockerfile": $dockerfile, "flavour": $flavour, "version": $version, "labels": $labels}]')
            done
          done < <(echo "$CHANGED_DIRS" | jq -r '.[]')

          echo "matrix<<EOF" >> "$GITHUB_OUTPUT"
          echo "$result" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

  build-images:
    needs: detect-changes
    if: needs.detect-changes.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    uses: ./.github/workflows/_base.yaml
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
      packages: write
    with:
      image_name: ${{ matrix.image.name }}
      context_path: ${{ matrix.image.path }}
      version: ${{ matrix.image.version }}
      dockerfile: ${{ matrix.image.dockerfile }}
      flavour: ${{ matrix.image.flavour }}
      extra_labels: ${{ matrix.image.labels }}
      # PRs only verify the image builds; publishing happens on push to main
      push: ${{ github.event_name == 'push' }}
