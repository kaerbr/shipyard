name: 🚢 Shipyard Main Builder

on:
  push:
    branches: [main]
    paths: ["images/**"]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_changes: ${{ steps.set-matrix.outputs.has_changes }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62 # v47
        with:
          files: images/**
          dir_names: true
          dir_names_max_depth: 3
          matrix: true

      - name: Set matrix
        id: set-matrix
        run: |
          CHANGED_DIRS='${{ steps.changed-files.outputs.all_changed_files }}'
          result="[]"
          echo "changed dirs: $CHANGED_DIRS"

          while IFS= read -r dir; do
            name=$(echo "$dir" | cut -d'/' -f2)
            path="./$dir"
            # "^\s*#" matches lines where "#" is the first non-whitespace character, so it handles both "#" comment and "  # indented comment".
            version=$(grep -v '^\s*#' "$dir/VERSION" || exit 1)
            labels=$(grep -v '^\s*#' "$dir/LABELS" || exit 1)

            result=$(echo "$result" | jq \
              --arg name "$name" \
              --arg path "$path" \
              --arg version "$version" \
              --arg labels "$labels" \
              '. += [{"name": $name, "path": $path, "version": $version, "labels": $labels}]')
          done < <(echo "$CHANGED_DIRS" | jq -r '.[]')
          echo "matrix<<EOF" >> "$GITHUB_OUTPUT"
          echo "$result" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "has_changes=true" >> $GITHUB_OUTPUT

  build-images:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    uses: ./.github/workflows/_base.yaml
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
      packages: write
    with:
      image_name: ${{ matrix.image.name }}
      context_path: ${{ matrix.image.path }}
      version: ${{ matrix.image.version }}
      extra_labels: ${{ matrix.image.labels }}
