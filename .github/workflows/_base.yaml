name: Create and publish a Docker image
on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
        description: Name of the image
      context_path:
        required: true
        type: string
        description: Directory to Dockerfile
      version:
        required: false
        type: string
        default: latest
        description: Version of the application
      dockerfile:
        required: false
        type: string
        default: Dockerfile
        description: Filename of the Dockerfile
      flavour:
        required: false
        type: string
        default: ""
        description: Flavour name (used as tag prefix)
      extra_labels:
        required: false
        type: string
        default: ""
        description: Custom labels to apply
      push:
        required: false
        type: boolean
        default: false
        description: Push the image and attestation; off by default so builds are side-effect-free unless the caller explicitly publishes

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
      packages: write
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        id: login
        if: ${{ inputs.push }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # This step uses [docker/metadata-action](https://github.com/docker/metadata-action#about) to extract tags and labels that will be applied to the specified image.
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ inputs.image_name }}
          # If flavour="debian", tags: debian-0.0.39, debian-latest
          # If flavour="", tags: 0.0.39, latest
          tags: |
            type=raw,value=${{ inputs.flavour }}${{ inputs.flavour != '' && '-' || '' }}${{ inputs.version }}
            type=raw,value=${{ inputs.flavour }}${{ inputs.flavour != '' && '-' || '' }}latest
          labels: |
            org.opencontainers.image.version=${{ inputs.version }}
            ${{ inputs.extra_labels }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context_path }}
          file: ${{ inputs.context_path }}/${{ inputs.dockerfile }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Disable buildx's built-in provenance attestation so actions/attest
          # below is the single source of truth — avoids duplicate attestation entries.
          provenance: false
          build-args: |
            VERSION=${{ inputs.version }}

      # This step generates an artifact attestation for the image, which is an unforgeable statement about where and how it was built. It increases supply chain security for people who consume the image. For more information, see [Using artifact attestations to establish provenance for builds](/actions/security-guides/using-artifact-attestations-to-establish-provenance-for-builds).
      - name: Attest
        id: attest
        # No pushed digest to attest on a build-only run
        if: ${{ inputs.push }}
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}/${{ inputs.image_name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
